const FAIXA_POR_ID = Object.fromEntries(FAIXAS.map(f => [f.id, f]));
const DOM_POR_ID   = Object.fromEntries(DOMINIOS.map(d => [d.id, d]));

/* Identificador estável de cada indicador: faixa.dominio.indice */
function idIndicador(faixaId, domId, i){ return faixaId + '.' + domId + '.' + i; }
function indicadoresDaFaixa(faixaId){
  const f = FAIXA_POR_ID[faixaId]; if(!f) return [];
  const lista = [];
  DOMINIOS.forEach(d => (f.indicadores[d.id]||[]).forEach((texto,i) =>
    lista.push({ id: idIndicador(faixaId, d.id, i), dominio: d.id, texto })));
  return lista;
}
function faixaPorIdade(idade){
  if(idade == null || isNaN(idade)) return null;
  if(idade < FAIXAS[0].min) return FAIXAS[0];
  const f = FAIXAS.find(f => idade >= f.min && idade <= f.max);
  return f || FAIXAS[FAIXAS.length-1];
}

/* =====================================================================
   2. ESTADO E PERSISTÊNCIA
   ===================================================================== */

const CHAVE = 'monitor-fe-v1';
let dados = { alunos: [], avaliacoes: [] };
let ui = { tab:'painel', alunoSel:null, filtroTurma:'', filtroFaixa:'', busca:'', rascunho:null };

function carregar(){
  try {
    const bruto = localStorage.getItem(CHAVE);
    if(bruto){
      const obj = JSON.parse(bruto);
      dados.alunos = Array.isArray(obj.alunos) ? obj.alunos : [];
      dados.avaliacoes = Array.isArray(obj.avaliacoes) ? obj.avaliacoes : [];
    }
  } catch(e){ console.warn('Não foi possível ler os dados guardados', e); }
}
function guardar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
  catch(e){ toast('Não foi possível guardar (armazenamento indisponível).', true); }
}

/* ---------- utilitários ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoje = () => new Date().toISOString().slice(0,10);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dataPT(iso){
  if(!iso) return '—';
  const [a,m,d] = iso.split('-'); return d && m && a ? `${d}/${m}/${a}` : iso;
}
function idadeDe(nascimento, refIso){
  if(!nascimento) return null;
  const ref = refIso ? new Date(refIso) : new Date();
  const n = new Date(nascimento);
  if(isNaN(n) || isNaN(ref)) return null;
  let i = ref.getFullYear() - n.getFullYear();
  const m = ref.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && ref.getDate() < n.getDate())) i--;
  return i;
}
function toast(msg, erro){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] text-sm px-4 py-2.5 rounded-lg shadow-lg no-print fade-in ' +
                (erro ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 3200);
}

/* ---------- consultas ---------- */
const alunoPorId = id => dados.alunos.find(a => a.id === id) || null;
function avaliacoesDe(alunoId){
  return dados.avaliacoes.filter(a => a.alunoId === alunoId)
    .sort((x,y) => x.data === y.data ? x.criadoEm - y.criadoEm : (x.data < y.data ? -1 : 1));
}
const ultimaAvaliacao = alunoId => { const l = avaliacoesDe(alunoId); return l.length ? l[l.length-1] : null; };

/* Pontuação de um domínio numa avaliação: 0–100 (%) da consolidação esperada */
function pontuacaoDominio(av, domId){
  if(!av) return null;
  const idxs = (FAIXA_POR_ID[av.faixaId]?.indicadores[domId] || []);
  let soma = 0, n = 0;
  idxs.forEach((_, i) => {
    const v = av.respostas[idIndicador(av.faixaId, domId, i)];
    if(v !== undefined && v !== null){ soma += v; n++; }
  });
  return n ? Math.round((soma / (n*3)) * 100) : null;
}
function pontuacaoGeral(av){
  if(!av) return null;
  const vals = DOMINIOS.map(d => pontuacaoDominio(av, d.id)).filter(v => v !== null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0) / vals.length) : null;
}
function preenchimento(av){
  if(!av) return 0;
  const total = indicadoresDaFaixa(av.faixaId).length;
  const resp = Object.values(av.respostas || {}).filter(v => v !== undefined && v !== null).length;
  return total ? Math.round(resp/total*100) : 0;
}
function corPontuacao(p){
  if(p === null) return '#cbd5e1';
  if(p >= 75) return '#059669';
  if(p >= 50) return '#d97706';
  if(p >= 25) return '#f97316';
  return '#e11d48';
}
function rotuloPontuacao(p){
  if(p === null) return 'Sem dados';
  if(p >= 75) return 'Consolidado';
  if(p >= 50) return 'Em desenvolvimento';
  if(p >= 25) return 'Emergente';
  return 'Requer apoio';
}
/* Alunos filtrados pelos filtros ativos do painel/lista */
function alunosFiltrados(){
  const b = ui.busca.trim().toLowerCase();
  return dados.alunos.filter(a => {
    if(ui.filtroTurma && (a.turma||'') !== ui.filtroTurma) return false;
    if(ui.filtroFaixa && faixaDoAluno(a).id !== ui.filtroFaixa) return false;
    if(b && !(a.nome.toLowerCase().includes(b) || (a.turma||'').toLowerCase().includes(b))) return false;
    return true;
  }).sort((x,y) => x.nome.localeCompare(y.nome, 'pt'));
}
function faixaDoAluno(a){ return faixaPorIdade(idadeDe(a.nascimento)) || FAIXAS[0]; }
const turmas = () => [...new Set(dados.alunos.map(a => a.turma).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));

   4. GRÁFICOS (SVG, sem dependências externas)
   ===================================================================== */

/* Radar dos 8 domínios */
function svgRadar(valores){
  const W = 340, H = 268, CX = W/2, CY = H/2, R = 84, n = valores.length;
  const ponto = (i, r) => {
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    return [CX + Math.cos(ang)*r, CY + Math.sin(ang)*r];
  };
  let teias = '';
  [0.25,0.5,0.75,1].forEach(f => {
    const pts = valores.map((_,i) => ponto(i, R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
    teias += `<polygon points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;
  });
  let eixos = '', rotulos = '';
  valores.forEach((v,i) => {
    const [x,y] = ponto(i, R);
    eixos += `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`;
    const [lx,ly] = ponto(i, R+16);
    const anchor = Math.abs(lx-CX) < 8 ? 'middle' : (lx > CX ? 'start' : 'end');
    rotulos += `<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="#64748b">${esc(v.curto)}</text>`
              + `<text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="${anchor}" font-size="9" font-weight="700" fill="${corPontuacao(v.valor)}">${v.valor==null?'—':v.valor+'%'}</text>`;
  });
  const pts = valores.map((v,i) => ponto(i, R*((v.valor==null?0:v.valor)/100)).map(p=>p.toFixed(1)).join(',')).join(' ');
  const bolas = valores.map((v,i) => {
    const [x,y] = ponto(i, R*((v.valor==null?0:v.valor)/100));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${corPontuacao(v.valor)}"><title>${esc(v.nome)}: ${v.valor==null?'sem dados':v.valor+'%'}</title></circle>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full max-w-[340px] mx-auto">
    ${teias}${eixos}
    <polygon points="${pts}" fill="rgba(79,70,229,.18)" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>
    ${bolas}${rotulos}
  </svg>`;
}

/* Linha de evolução da pontuação geral ao longo das observações */
function svgLinha(pontos){
  const W = 620, H = 200, pl = 34, pr = 12, pt = 14, pb = 30;
  if(pontos.length === 0) return '<p class="text-sm text-slate-500 py-8 text-center">Ainda sem observações registadas.</p>';
  const gw = W - pl - pr, gh = H - pt - pb;
  const x = i => pontos.length === 1 ? pl + gw/2 : pl + (gw * i / (pontos.length-1));
  const y = v => pt + gh - (gh * v/100);
  let grelha = '';
  [0,25,50,75,100].forEach(v => {
    grelha += `<line x1="${pl}" y1="${y(v)}" x2="${W-pr}" y2="${y(v)}" stroke="#e2e8f0" stroke-width="1"/>
               <text x="${pl-6}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`;
  });
  const linha = pontos.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${y(0)} ` + pontos.map((p,i)=>`L${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ') + ` L${x(pontos.length-1).toFixed(1)},${y(0)} Z`;
  const marcas = pontos.map((p,i) => `
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="4.5" fill="#fff" stroke="${corPontuacao(p.valor)}" stroke-width="2.5">
      <title>${dataPT(p.data)} — ${p.valor}%</title></circle>
    <text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="9" fill="#64748b">${dataPT(p.data).slice(0,5)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full">
    ${grelha}
    <path d="${area}" fill="rgba(79,70,229,.10)"/>
    <path d="${linha}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${marcas}
  </svg>`;
}

/* Barra horizontal simples */
function barra(valor, cor){
  const v = valor == null ? 0 : valor;
  return `<div class="h-2 rounded-full bg-slate-200 overflow-hidden">
            <div class="h-full rounded-full" style="width:${v}%; background:${cor || corPontuacao(valor)}"></div>
          </div>`;
}

function linhaAluno(a){
  const avs = avaliacoesDe(a.id);
  const ult = avs.length ? avs[avs.length-1] : null;
  const pen = avs.length > 1 ? avs[avs.length-2] : null;
  const p = pontuacaoGeral(ult), pp = pontuacaoGeral(pen);
  /* só é comparável se as duas observações usaram o mesmo referencial */
  const delta = (p !== null && pp !== null && pen.faixaId === ult.faixaId) ? p - pp : null;
  const f = faixaDoAluno(a);
  const seta = delta === null ? '<span class="text-xs text-slate-400">—</span>'
    : delta > 0 ? `<span class="text-xs font-semibold text-emerald-600 flex items-center gap-1"><i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>+${delta} pp</span>`
    : delta < 0 ? `<span class="text-xs font-semibold text-rose-600 flex items-center gap-1"><i data-lucide="arrow-down-right" class="w-3.5 h-3.5"></i>${delta} pp</span>`
    : '<span class="text-xs font-semibold text-slate-500">estável</span>';
  return `<tr class="hover:bg-slate-50">
    <td class="px-5 py-3">
      <button onclick="irPara('progresso','${a.id}')" class="font-medium text-slate-800 hover:text-indigo-700 text-left">${esc(a.nome)}</button>
      <p class="text-xs text-slate-500">${a.turma ? esc(a.turma)+' • ' : ''}${idadeDe(a.nascimento)} anos</p>
    </td>
    <td class="px-3 py-3 text-xs text-slate-600">${f.nome}<br><span class="text-slate-400">${f.ciclo}</span></td>
    <td class="px-3 py-3 text-xs text-slate-600">${ult ? dataPT(ult.data) : '<span class="text-amber-600">nenhuma</span>'}</td>
    <td class="px-3 py-3">
      ${p===null ? '<span class="text-xs text-slate-400">sem dados</span>' : `
        <div class="flex items-center gap-2"><span class="text-xs font-bold w-9" style="color:${corPontuacao(p)}">${p}%</span>
        <div class="flex-1">${barra(p)}</div></div>
        <p class="text-[11px] text-slate-500 mt-0.5">${rotuloPontuacao(p)}</p>`}
    </td>
    <td class="px-3 py-3">${seta}</td>
    <td class="px-3 py-3 text-right whitespace-nowrap no-print">
      <button onclick="irPara('avaliacao','${a.id}')" title="Registar observação" class="p-1.5 rounded-lg hover:bg-indigo-50 text-indigo-600"><i data-lucide="clipboard-pen" class="w-4 h-4"></i></button>
      <button onclick="irPara('progresso','${a.id}')" title="Ver progresso" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600"><i data-lucide="trending-up" class="w-4 h-4"></i></button>
    </td>
  </tr>`;
}

    <p class="text-sm text-slate-500">${esc(msg)}</p></div>`;

function cartaoAluno(a){
  const f = faixaDoAluno(a), avs = avaliacoesDe(a.id), ult = avs.length ? avs[avs.length-1] : null;
  const p = pontuacaoGeral(ult);
  return `<div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col gap-3">
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-700 font-bold flex items-center justify-center shrink-0">${esc(iniciais(a.nome))}</div>
        <div class="min-w-0">
          <p class="font-semibold truncate">${esc(a.nome)}</p>
          <p class="text-xs text-slate-500">${a.turma ? esc(a.turma)+' • ' : ''}${idadeDe(a.nascimento)} anos</p>
        </div>
      </div>
      <div class="flex gap-1 shrink-0">
        <button onclick="abrirModalAluno('${a.id}')" title="Editar" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><i data-lucide="pencil" class="w-4 h-4"></i></button>
        <button onclick="apagarAluno('${a.id}')" title="Eliminar" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
    </div>
    <div class="text-xs bg-slate-50 border border-slate-100 rounded-lg px-3 py-2">
      <span class="font-semibold text-slate-700">${f.nome}</span> — ${esc(f.ciclo)}
      <p class="text-slate-500 mt-0.5">${esc(f.foco)}</p>
    </div>
    ${p === null ? `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">Sem observações registadas</p>` : `
    <div>
      <div class="flex justify-between text-xs mb-1"><span class="text-slate-600">Consolidação global</span>
        <span class="font-bold" style="color:${corPontuacao(p)}">${p}% · ${rotuloPontuacao(p)}</span></div>
      ${barra(p)}
      <p class="text-[11px] text-slate-500 mt-1">${avs.length} observação(ões) • última a ${dataPT(ult.data)}</p>
    </div>`}
    ${a.notas ? `<p class="text-xs text-slate-600 border-l-2 border-indigo-200 pl-2 italic">${esc(a.notas)}</p>` : ''}
    <div class="flex gap-2 pt-1">
      <button onclick="irPara('avaliacao','${a.id}')" class="flex-1 text-xs font-medium bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Observar</button>
      <button onclick="irPara('progresso','${a.id}')" class="flex-1 text-xs font-medium border border-slate-300 rounded-lg py-2 hover:bg-slate-50">Progresso</button>
    </div>
  </div>`;
}
function iniciais(nome){
  const p = nome.trim().split(/\s+/);
  return ((p[0]||'')[0] || '' ).toUpperCase() + (p.length>1 ? (p[p.length-1][0]||'').toUpperCase() : '');
}

/* ---------- modal aluno ---------- */
function abrirModalAluno(id){
  const a = id ? alunoPorId(id) : null;
  document.getElementById('aluno-id').value = a ? a.id : '';
  document.getElementById('aluno-nome').value = a ? a.nome : '';
  document.getElementById('aluno-turma').value = a ? (a.turma||'') : '';
  document.getElementById('aluno-nascimento').value = a ? a.nascimento : '';
  document.getElementById('aluno-notas').value = a ? (a.notas||'') : '';
  document.getElementById('modal-aluno-titulo').innerHTML =
    `<i data-lucide="${a?'pencil':'user-plus'}" class="w-5 h-5 text-indigo-600"></i> ${a?'Editar aluno':'Novo aluno'}`;
  atualizarFaixaInfo();
  document.getElementById('modal-aluno').classList.remove('hidden');
  icones();
  setTimeout(() => document.getElementById('aluno-nome').focus(), 50);
}
function fecharModalAluno(){ document.getElementById('modal-aluno').classList.add('hidden'); }

function atualizarFaixaInfo(){
  const el = document.getElementById('aluno-faixa-info');
  const nasc = document.getElementById('aluno-nascimento').value;
  const idade = idadeDe(nasc);
  if(idade === null || idade < 0){ el.classList.add('hidden'); return; }
  const f = faixaPorIdade(idade);
  el.classList.remove('hidden');
  el.innerHTML = `<strong>${idade} anos</strong> → referencial <strong>${f.nome}</strong> (${esc(f.ciclo)}) · ${indicadoresDaFaixa(f.id).length} indicadores`;
}

function apagarAluno(id){
  const a = alunoPorId(id); if(!a) return;
  const n = avaliacoesDe(id).length;
  if(!confirm(`Eliminar "${a.nome}"${n?` e as suas ${n} observação(ões)`:''}? Esta ação não pode ser anulada.`)) return;
  dados.alunos = dados.alunos.filter(x => x.id !== id);
  dados.avaliacoes = dados.avaliacoes.filter(x => x.alunoId !== id);
  if(ui.alunoSel === id) ui.alunoSel = null;
  guardar(); render(); icones(); toast('Aluno eliminado.');
}

/* =====================================================================
   7. VISTA: REGISTAR OBSERVAÇÃO
   ===================================================================== */

function iniciarRascunho(alunoId){
  const a = alunoPorId(alunoId);
  if(!a){ ui.rascunho = null; return; }
  const ult = ultimaAvaliacao(alunoId);
  ui.rascunho = {
    alunoId, data: hoje(),
    faixaId: (ult && ult.faixaId) || faixaDoAluno(a).id,
    respostas: {}, observacoes: '', editandoId: null
  };
}

function renderAvaliacao(){
  const el = document.getElementById('view-avaliacao');
  if(dados.alunos.length === 0){
    el.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-8">${vazio('Adicione primeiro um aluno para poder registar observações.')}</div>`;
    return;
  }
  if(ui.alunoSel && (!ui.rascunho || ui.rascunho.alunoId !== ui.alunoSel)) iniciarRascunho(ui.alunoSel);
  if(!ui.rascunho){ ui.alunoSel = alunosFiltrados()[0]?.id || dados.alunos[0].id; iniciarRascunho(ui.alunoSel); }

  const r = ui.rascunho, aluno = alunoPorId(r.alunoId), faixa = FAIXA_POR_ID[r.faixaId];
  const faixaEsperada = faixaDoAluno(aluno);
  const total = indicadoresDaFaixa(r.faixaId).length;
  const respondidos = Object.values(r.respostas).filter(v => v !== undefined && v !== null).length;
  const parcial = pontuacaoGeral({ faixaId:r.faixaId, respostas:r.respostas });

  el.innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div><h2 class="text-xl font-bold">Registar observação</h2>
        <p class="text-sm text-slate-500">Classifique cada requisito de aprendizagem esperado para a faixa etária.</p></div>
      ${r.editandoId ? `<span class="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-lg">A editar observação de ${dataPT(r.data)}</span>` : ''}
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm mb-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Aluno</label>
          <select onchange="trocarAlunoAvaliacao(this.value)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
            ${dados.alunos.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(a =>
              `<option value="${a.id}" ${a.id===r.alunoId?'selected':''}>${esc(a.nome)}${a.turma?' — '+esc(a.turma):''}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Data da observação</label>
          <input type="date" value="${r.data}" max="${hoje()}" onchange="ui.rascunho.data=this.value"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Referencial aplicado</label>
          <select onchange="trocarFaixaAvaliacao(this.value)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
            ${FAIXAS.map(f => `<option value="${f.id}" ${f.id===r.faixaId?'selected':''}>${f.nome} — ${esc(f.ciclo)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
        <span class="bg-indigo-50 text-indigo-800 border border-indigo-100 px-2.5 py-1 rounded-md">${idadeDe(aluno.nascimento)} anos • faixa sugerida: ${faixaEsperada.nome}</span>
        ${r.faixaId !== faixaEsperada.id ? `<span class="bg-amber-50 text-amber-800 border border-amber-200 px-2.5 py-1 rounded-md flex items-center gap-1">
          <i data-lucide="info" class="w-3.5 h-3.5"></i> Referencial adaptado (diferente da faixa etária do aluno)</span>` : ''}
        <button onclick="copiarUltima()" class="ml-auto flex items-center gap-1.5 border border-slate-300 px-2.5 py-1.5 rounded-lg hover:bg-slate-50">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Partir da última observação</button>
        <button onclick="limparRespostas()" class="flex items-center gap-1.5 border border-slate-300 px-2.5 py-1.5 rounded-lg hover:bg-slate-50">
          <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Limpar</button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm mb-4 sticky top-[104px] z-20">
      <div class="flex flex-wrap items-center gap-4">
        <div class="flex-1 min-w-[180px]">
          <div class="flex justify-between text-xs mb-1"><span class="font-medium">Preenchido</span><span>${respondidos}/${total}</span></div>
          ${barra(total ? Math.round(respondidos/total*100) : 0, '#4f46e5')}
        </div>
        <div class="text-center px-3">
          <p class="text-lg font-bold" style="color:${corPontuacao(parcial)}">${parcial===null?'—':parcial+'%'}</p>
          <p class="text-[11px] text-slate-500">consolidação</p>
        </div>
        <button onclick="guardarAvaliacao()" class="flex items-center gap-1.5 bg-emerald-600 text-white text-sm px-4 py-2.5 rounded-lg font-medium hover:bg-emerald-700">
          <i data-lucide="save" class="w-4 h-4"></i> Guardar observação
        </button>
      </div>
      <div class="flex flex-wrap gap-3 mt-3 pt-3 border-t border-slate-100">
        ${NIVEIS.map(n => `<span class="flex items-center gap-1.5 text-[11px] text-slate-600">
          <span class="w-3.5 h-3.5 rounded" style="background:${n.cor}"></span>${n.curto} — ${n.nome}</span>`).join('')}
      </div>
    </div>

    <p class="text-sm text-slate-600 mb-3 flex items-center gap-2">
      <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i>
      <span><strong>${faixa.nome}</strong> — ${esc(faixa.foco)}</span></p>

    <div class="space-y-4">${DOMINIOS.map(d => blocoDominio(d, faixa, r)).join('')}</div>

    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm mt-4">
      <label class="block text-sm font-semibold mb-2 flex items-center gap-2"><i data-lucide="notebook-pen" class="w-4 h-4 text-indigo-600"></i> Observações qualitativas</label>
      <textarea rows="4" oninput="ui.rascunho.observacoes=this.value" placeholder="Contexto, estratégias que resultaram, situações relevantes..."
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">${esc(r.observacoes)}</textarea>
      <div class="flex justify-end mt-3">
        <button onclick="guardarAvaliacao()" class="flex items-center gap-1.5 bg-emerald-600 text-white text-sm px-4 py-2.5 rounded-lg font-medium hover:bg-emerald-700">
          <i data-lucide="save" class="w-4 h-4"></i> Guardar observação</button>
      </div>
    </div>`;
}

function blocoDominio(d, faixa, r){
  const itens = faixa.indicadores[d.id] || [];
  const vals = itens.map((_,i) => r.respostas[idIndicador(faixa.id, d.id, i)]).filter(v => v !== undefined && v !== null);
  const p = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length*3)*100) : null;
  return `<section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between gap-3" style="background:${d.cor}0d">
      <h3 class="font-semibold text-sm flex items-center gap-2"><i data-lucide="${d.icone}" class="w-4 h-4" style="color:${d.cor}"></i>${d.nome}</h3>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500">${vals.length}/${itens.length}</span>
        <span class="text-xs font-bold" style="color:${corPontuacao(p)}">${p===null?'—':p+'%'}</span>
      </div>
    </div>
    <div class="divide-y divide-slate-100">
      ${itens.map((texto,i) => {
        const id = idIndicador(faixa.id, d.id, i);
        const atual = r.respostas[id];
        return `<div class="px-5 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
          <p class="text-sm text-slate-700 flex-1">${esc(texto)}</p>
          <div class="flex gap-1.5 shrink-0">
            ${NIVEIS.map(n => `<button onclick="responder('${id}',${n.v})" title="${esc(n.nome)}: ${esc(n.desc)}"
              class="nivel-btn w-11 h-9 rounded-lg text-xs font-bold border"
              style="${atual===n.v ? `background:${n.cor}; color:${n.texto}; border-color:${n.texto}55; box-shadow:0 0 0 2px ${n.texto}22;`
                                   : 'background:#fff; color:#94a3b8; border-color:#e2e8f0;'}">${n.curto}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

function responder(indicadorId, valor){
  if(!ui.rascunho) return;
  if(ui.rascunho.respostas[indicadorId] === valor) delete ui.rascunho.respostas[indicadorId];
  else ui.rascunho.respostas[indicadorId] = valor;
  renderAvaliacao(); icones();
}
function trocarAlunoAvaliacao(id){ ui.alunoSel = id; iniciarRascunho(id); renderAvaliacao(); icones(); }
function trocarFaixaAvaliacao(faixaId){
  const r = ui.rascunho;
  if(Object.keys(r.respostas).length && !confirm('Mudar de referencial limpa as respostas já dadas. Continuar?')){ renderAvaliacao(); icones(); return; }
  r.faixaId = faixaId; r.respostas = {};
  renderAvaliacao(); icones();
}
function limparRespostas(){
  if(!ui.rascunho || !Object.keys(ui.rascunho.respostas).length) return;
  if(!confirm('Limpar todas as classificações desta observação?')) return;
  ui.rascunho.respostas = {};
  renderAvaliacao(); icones();
}
function copiarUltima(){
  const r = ui.rascunho, ult = ultimaAvaliacao(r.alunoId);
  if(!ult){ toast('Este aluno ainda não tem observações anteriores.', true); return; }
  r.faixaId = ult.faixaId;
  r.respostas = { ...ult.respostas };
  r.observacoes = '';
  renderAvaliacao(); icones();
  toast('Respostas da observação de ' + dataPT(ult.data) + ' carregadas. Ajuste o que mudou.');
}
function guardarAvaliacao(){
  const r = ui.rascunho;
  if(!r) return;
  const n = Object.values(r.respostas).filter(v => v !== undefined && v !== null).length;
  if(n === 0){ toast('Classifique pelo menos um indicador antes de guardar.', true); return; }
  if(r.editandoId){
    const av = dados.avaliacoes.find(a => a.id === r.editandoId);
    if(av){ Object.assign(av, { data:r.data, faixaId:r.faixaId, respostas:{...r.respostas}, observacoes:r.observacoes }); }
  } else {
    dados.avaliacoes.push({ id: uid(), alunoId:r.alunoId, data:r.data, faixaId:r.faixaId,
      respostas:{...r.respostas}, observacoes:r.observacoes, criadoEm: Date.now() });
  }
  guardar();
  const alunoId = r.alunoId;
  ui.rascunho = null;
  toast('Observação guardada.');
  irPara('progresso', alunoId);
}
function editarAvaliacao(id){
  const av = dados.avaliacoes.find(a => a.id === id); if(!av) return;
  ui.alunoSel = av.alunoId;
  ui.rascunho = { alunoId:av.alunoId, data:av.data, faixaId:av.faixaId,
                  respostas:{...av.respostas}, observacoes:av.observacoes||'', editandoId:av.id };
  irPara('avaliacao');
}
function apagarAvaliacao(id){
  const av = dados.avaliacoes.find(a => a.id === id); if(!av) return;
  if(!confirm('Eliminar a observação de ' + dataPT(av.data) + '?')) return;
  dados.avaliacoes = dados.avaliacoes.filter(a => a.id !== id);
  guardar(); render(); icones(); toast('Observação eliminada.');
}

   8. VISTA: PROGRESSO DO ALUNO

function renderProgresso(){
  const el = document.getElementById('view-progresso');
  if(dados.alunos.length === 0){
    el.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-8">${vazio('Ainda não há alunos registados.')}</div>`;
    return;
  }
  if(!ui.alunoSel || !alunoPorId(ui.alunoSel)) ui.alunoSel = alunosFiltrados()[0]?.id || dados.alunos[0].id;
  const aluno = alunoPorId(ui.alunoSel);
  const avs = avaliacoesDe(aluno.id);
  const ult = avs.length ? avs[avs.length-1] : null;
  const pen = avs.length > 1 ? avs[avs.length-2] : null;
  const geral = pontuacaoGeral(ult), geralAnt = pontuacaoGeral(pen);
  const faixa = ult ? FAIXA_POR_ID[ult.faixaId] : faixaDoAluno(aluno);

  const seletor = `<select onchange="ui.alunoSel=this.value; render(); icones()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
    ${dados.alunos.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(a =>
      `<option value="${a.id}" ${a.id===aluno.id?'selected':''}>${esc(a.nome)}${a.turma?' — '+esc(a.turma):''}</option>`).join('')}</select>`;

  if(!ult){
    el.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-xl font-bold">Progresso de ${esc(aluno.nome)}</h2>
        <div class="flex gap-2 no-print">${seletor}
          <button onclick="irPara('avaliacao','${aluno.id}')" class="bg-indigo-600 text-white text-sm px-3.5 py-2 rounded-lg font-medium hover:bg-indigo-700">Registar observação</button></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-8">${vazio('Este aluno ainda não tem observações registadas.')}</div>`;
    return;
  }

  const dominios = DOMINIOS.map(d => {
    const atual = pontuacaoDominio(ult, d.id);
    const anterior = pen && pen.faixaId === ult.faixaId ? pontuacaoDominio(pen, d.id) : null;
    return { ...d, atual, anterior, delta: (atual!==null && anterior!==null) ? atual-anterior : null };
  });
  const radar = dominios.map(d => ({ curto: d.curto, nome:d.nome, valor:d.atual }));
  const serie = avs.map(a => ({ data:a.data, valor: pontuacaoGeral(a) })).filter(p => p.valor !== null);
  const deltaGeral = (geral!==null && geralAnt!==null && pen.faixaId===ult.faixaId) ? geral-geralAnt : null;

  el.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div>
        <h2 class="text-xl font-bold">${esc(aluno.nome)}</h2>
        <p class="text-sm text-slate-500">${aluno.turma ? esc(aluno.turma)+' • ' : ''}${idadeDe(aluno.nascimento)} anos • ${faixa.nome} (${esc(faixa.ciclo)})</p>
      </div>
      <div class="flex flex-wrap gap-2 no-print">${seletor}
        <button onclick="irPara('avaliacao','${aluno.id}')" class="flex items-center gap-1.5 bg-indigo-600 text-white text-sm px-3.5 py-2 rounded-lg font-medium hover:bg-indigo-700">
          <i data-lucide="clipboard-pen" class="w-4 h-4"></i> Nova observação</button>
        <button onclick="window.print()" class="flex items-center gap-1.5 border border-slate-300 text-sm px-3 py-2 rounded-lg hover:bg-slate-50">
          <i data-lucide="printer" class="w-4 h-4"></i> Relatório</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm print-block">
        <h3 class="font-semibold text-sm mb-3 flex items-center gap-2"><i data-lucide="gauge" class="w-4 h-4 text-indigo-600"></i> Situação atual</h3>
        <p class="text-4xl font-bold" style="color:${corPontuacao(geral)}">${geral}%</p>
        <p class="text-sm text-slate-600 mb-1">${rotuloPontuacao(geral)}</p>
        <p class="text-xs text-slate-500">Observação de ${dataPT(ult.data)} • ${preenchimento(ult)}% dos indicadores classificados</p>
        <div class="mt-3">${barra(geral)}</div>
        ${deltaGeral !== null ? `<p class="mt-3 text-sm font-medium ${deltaGeral>0?'text-emerald-600':deltaGeral<0?'text-rose-600':'text-slate-500'}">
          ${deltaGeral>0?'▲ +':deltaGeral<0?'▼ ':'■ '}${deltaGeral===0?'sem alteração':Math.abs(deltaGeral)+' pontos percentuais'} face a ${dataPT(pen.data)}</p>` :
          `<p class="mt-3 text-xs text-slate-500">Sem comparação direta disponível.</p>`}
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm print-block">
        <h3 class="font-semibold text-sm mb-1 flex items-center gap-2"><i data-lucide="radar" class="w-4 h-4 text-indigo-600"></i> Perfil por domínio</h3>
        ${svgRadar(radar)}
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm print-block">
        <h3 class="font-semibold text-sm mb-3 flex items-center gap-2"><i data-lucide="lightbulb" class="w-4 h-4 text-amber-500"></i> Leitura pedagógica</h3>
        ${leituraPedagogica(dominios, geral)}

const SUGESTOES = {
  atencao:'Fracionar a tarefa em blocos curtos com pausa marcada e reduzir estímulos na mesa de trabalho.',
  memoria:'Usar apoios visuais dos passos da tarefa e pedir que repita a instrução por palavras próprias.',
  inibicao:'Combinar sinais não verbais de paragem e antecipar as regras antes de cada atividade.',
  flexibilidade:'Avisar as mudanças com antecedência e treinar "e se resolvermos de outra forma?".',
  planeamento:'Introduzir checklist visível da tarefa e revisão do material no início e no fim da aula.',
  iniciativa:'Definir o primeiro passo em conjunto e reforçar o esforço, não apenas o resultado.',
  emocional:'Combinar uma estratégia de regulação (pausa, respiração) e nomear a emoção antes de agir.',
  metacognicao:'Terminar a tarefa com duas perguntas: "o que correu bem?" e "o que faço diferente?".'
};
function leituraPedagogica(dominios, geral){
  const comDados = dominios.filter(d => d.atual !== null);
  if(!comDados.length) return '<p class="text-sm text-slate-500">Sem dados suficientes.</p>';
  const ord = comDados.slice().sort((a,b) => a.atual - b.atual);
  const frageis = ord.slice(0,2), fortes = ord.slice(-2).reverse();
  const progrediu = dominios.filter(d => d.delta !== null && d.delta > 0);
  return `
    <p class="text-xs text-slate-600 mb-3">Perfil global <strong>${rotuloPontuacao(geral).toLowerCase()}</strong> (${geral}%).</p>
    <p class="text-xs font-semibold text-emerald-700 mb-1">Pontos fortes</p>
    <ul class="text-xs text-slate-700 mb-3 space-y-0.5">${fortes.map(d => `<li>• ${d.nome} (${d.atual}%)</li>`).join('')}</ul>
    <p class="text-xs font-semibold text-rose-700 mb-1">A trabalhar</p>
    <ul class="text-xs text-slate-700 space-y-1.5">${frageis.map(d => `<li><span class="font-medium">${d.nome} (${d.atual}%)</span><br><span class="text-slate-500">${SUGESTOES[d.id]}</span></li>`).join('')}</ul>
    ${progrediu.length ? `<p class="text-xs text-emerald-700 mt-3 pt-3 border-t border-slate-100">Progrediu em: ${progrediu.map(d=>d.nome).join(', ')}.</p>` : ''}`;
}

function descarregar(nome, conteudo, tipo){
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportarJSON(){
  descarregar(`funcoes-executivas-${hoje()}.json`,
    JSON.stringify({ versao:1, exportadoEm:new Date().toISOString(), ...dados }, null, 2),
    'application/json');
  toast('Cópia de segurança exportada.');
}
function exportarCSV(){
  if(!dados.avaliacoes.length){ toast('Ainda não há observações para exportar.', true); return; }
  const linhas = [['Aluno','Turma','Idade na observação','Data','Faixa','Dominio','Indicador','Nivel','Descricao nivel','Observacoes']];
  dados.avaliacoes.slice().sort((a,b) => a.data < b.data ? -1 : 1).forEach(av => {
    const al = alunoPorId(av.alunoId); if(!al) return;
    const f = FAIXA_POR_ID[av.faixaId]; if(!f) return;
    DOMINIOS.forEach(d => (f.indicadores[d.id]||[]).forEach((texto,i) => {
      const v = av.respostas[idIndicador(f.id, d.id, i)];
      if(v === undefined || v === null) return;
      linhas.push([al.nome, al.turma||'', idadeDe(al.nascimento, av.data), av.data, f.nome, d.nome, texto, v, NIVEIS[v].nome, av.observacoes||'']);
    }));
  });
  const csv = '﻿' + linhas.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  descarregar(`observacoes-${hoje()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV exportado (' + (linhas.length-1) + ' registos).');
}
function importarJSON(input){
  const ficheiro = input.files && input.files[0];
  if(!ficheiro) return;
  const leitor = new FileReader();
  leitor.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if(!Array.isArray(obj.alunos) || !Array.isArray(obj.avaliacoes)) throw new Error('formato');
      if(!confirm(`Importar ${obj.alunos.length} aluno(s) e ${obj.avaliacoes.length} observação(ões)? Os dados atuais serão substituídos.`)) return;
      dados = { alunos: obj.alunos, avaliacoes: obj.avaliacoes };
      ui.alunoSel = null; ui.rascunho = null;
      guardar(); render(); icones(); toast('Dados importados com sucesso.');
    } catch(err){ toast('Ficheiro inválido ou corrompido.', true); }
    finally { input.value = ''; }
  };
  leitor.readAsText(ficheiro);
}
function apagarTudo(){
  if(!confirm('Apagar TODOS os alunos e observações? Esta ação não pode ser anulada.')) return;
  if(!confirm('Confirma? Recomenda-se exportar uma cópia de segurança antes.')) return;
  dados = { alunos:[], avaliacoes:[] }; ui.alunoSel = null; ui.rascunho = null;
  guardar(); render(); icones(); toast('Todos os dados foram apagados.');
}

function carregarExemplo(){
  if(dados.alunos.length && !confirm('Isto substitui os dados atuais pelos dados de exemplo. Continuar?')) return;
  const anoAtual = new Date().getFullYear();
  const modelo = [
    ['Ana Rita Marques','1.ºA', 6, 0.45, 0.10],
    ['Bruno Costa','1.ºA', 6, 0.30, 0.16],
    ['Carolina Nunes','3.ºB', 8, 0.62, 0.08],
    ['Diogo Ferreira','3.ºB', 8, 0.38, 0.14],
    ['Eva Sampaio','5.ºC', 10, 0.70, 0.06],
    ['Francisco Melo','5.ºC', 11, 0.44, 0.12],
    ['Gabriela Pinto','8.ºA', 13, 0.55, 0.09],
    ['Henrique Lopes','8.ºA', 13, 0.33, 0.15]
  ];
  const pesoDominio = { atencao:-0.10, memoria:0, inibicao:-0.08, flexibilidade:0.04,
                        planeamento:-0.06, iniciativa:0.02, emocional:0.06, metacognicao:-0.04 };
  const notas = ['Responde bem a apoios visuais.','Beneficia de pausas curtas entre tarefas.',
                 'Melhor desempenho em trabalho a pares.','Necessita de lembrete para iniciar a tarefa.',
                 'Mostra maior autonomia nas rotinas da manhã.',''];
  let semente = 7;
  const rnd = () => (semente = (semente*1103515245 + 12345) % 2147483648) / 2147483648;

  const alunos = [], avaliacoes = [];
  modelo.forEach(([nome, turma, idade, base, ganho], k) => {
    const alunoId = uid() + k;
    const mes = 1 + Math.floor(rnd()*12), dia = 1 + Math.floor(rnd()*27);
    alunos.push({ id:alunoId, nome, turma,
      nascimento: `${anoAtual-idade}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`,
      notas: notas[Math.floor(rnd()*notas.length)], criadoEm: Date.now() });
    const faixa = faixaPorIdade(idade);
    [0,1,2].forEach(t => {
      const d = new Date(); d.setMonth(d.getMonth() - (2-t)*3);
      const respostas = {};
      DOMINIOS.forEach(dom => (faixa.indicadores[dom.id]||[]).forEach((_,i) => {
        const alvo = (base + ganho*t + (pesoDominio[dom.id]||0) + (rnd()-0.5)*0.28) * 3;
        respostas[idIndicador(faixa.id, dom.id, i)] = Math.max(0, Math.min(3, Math.round(alvo)));
      }));
      avaliacoes.push({ id: uid()+k+t, alunoId, data: d.toISOString().slice(0,10), faixaId: faixa.id,
        respostas, observacoes: t===2 ? notas[Math.floor(rnd()*notas.length)] : '', criadoEm: Date.now()+t });
    });
  });
  dados = { alunos, avaliacoes };
  ui.alunoSel = null; ui.rascunho = null;
  guardar(); irPara('painel');
  toast('Dados de exemplo carregados: 8 alunos e 24 observações.');
}
