# Configuração do deploy no Netlify.
# O painel é um site estático: não há passo de build, publica-se a raiz.

[build]
  publish = "."
  command = ""

# As fontes têm nome fixo e nunca mudam — podem ficar em cache por muito tempo.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML tem de ser sempre revalidado, para o painel atualizar após cada deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
